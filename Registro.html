<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>

    <link rel="stylesheet" href="registro.css">
</head>
<body>

    <div class="contenedor">

        <div class="panel-izquierdo">
            <h1>BIENVENIDO</h1>

            <div class="circulo">
                <div class="logo-imagen">
                  <img src="logo.png" alt="Logo Agenda">
                </div>
            </div>

            <h2>REGISTRO</h2>

            <p>Crea tu cuenta para continuar</p>
        </div>

        <div class="panel-derecho">

            <form id="formRegistro">

                <h1>Crear Cuenta</h1>

                <div class="input-box">
                    <label>Nombre completo</label>
                    <input type="text" id="nombre" placeholder="Ingresa tu nombre">
                </div>

                <div class="input-box">
                    <label>Correo electrónico</label>
                    <input type="email" id="correo" placeholder="Ingresa tu correo">
                </div>

                <div class="input-box">
                    <label>Usuario</label>
                    <input type="text" id="usuario" placeholder="Ingresa un usuario">
                </div>

                <div class="input-box">
                    <label>Contraseña</label>
                    <input type="password" id="password" placeholder="Ingresa tu contraseña">
                </div>

                <div class="input-box">
                    <label>Confirmar contraseña</label>
                    <input type="password" id="confirmar" placeholder="Confirma tu contraseña">
                </div>

                <button type="button" onclick="registrarUsuario()">
                    Registrarme
                </button>

                <p id="mensaje"></p>

            </form>

        </div>

    </div>

    <script src="registro.js"></script>
</body>
</html>
